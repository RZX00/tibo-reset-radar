{
  "project_id": "tibo-reset-radar",
  "mode": "ghcr-docker-compose",
  "local": {
    "repo_root": "/mnt/e/app/tibo-reset-radar",
    "build_command": "git tag -a v0.2.0 -m 'v0.2.0' && git push origin v0.2.0 && printf '0.2.0\\n' > deploy/.release-tag",
    "tag_file": "deploy/.release-tag",
    "deploy_bundle_paths": [
      "deploy"
    ]
  },
  "remote": {
    "ssh_target": "gtd",
    "user": "root",
    "host": "8.217.57.141",
    "root": "/app/tibo-reset-radar",
    "bundle_root": "/app/tibo-reset-radar",
    "compose_file": "deploy/compose.production.yml",
    "env_file": "deploy/.env.production",
    "edge_config": "/opt/1panel/apps/openresty/openresty/conf/conf.d/tibo-reset.ewo.so.conf"
  },
  "release": {
    "deploy_command": "sh deploy/deploy.sh deploy/.env.production",
    "smoke": [
      "https://tibo-reset.ewo.so/",
      "https://tibo-reset.ewo.so/api/status",
      "https://tibo-reset.ewo.so/api/forecast?timezone=Asia%2FShanghai",
      "https://tibo-reset.ewo.so/api/share-card.png"
    ]
  },
  "diagnostics": {
    "compose_services": [
      "radar"
    ],
    "log_commands": {
      "radar": "docker compose --env-file deploy/.env.production -f deploy/compose.production.yml logs --tail=200 radar"
    },
    "state": {
      "database": "SQLite at /data/radar.db inside the radar-data volume",
      "backup": "docker compose --env-file deploy/.env.production -f deploy/compose.production.yml exec radar node -e \"require('node:sqlite');\" # stop the container and copy /data/radar.db for a cold copy"
    }
  }
}
