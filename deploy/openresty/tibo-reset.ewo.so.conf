server {
    listen 80;
    listen [::]:80;
    server_name tibo-reset.ewo.so;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tibo-reset.ewo.so;

    access_log /www/sites/tibo-reset.ewo.so/log/access.log main;
    error_log /www/sites/tibo-reset.ewo.so/log/error.log;

    ssl_certificate /www/sites/tibo-reset.ewo.so/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/tibo-reset.ewo.so/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RADAR_SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
