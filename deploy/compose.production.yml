name: tibo-reset-radar-production

services:
  radar:
    image: ${RADAR_IMAGE:?RADAR_IMAGE is required}
    restart: unless-stopped
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      # Empty means the ingest route is not registered at all.
      RADAR_INGEST_TOKEN: ${RADAR_INGEST_TOKEN:-}
      RADAR_COLLECTOR_MODE: ${RADAR_COLLECTOR_MODE:-poll}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-120000}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      TARGET_CONFIG_PATH: /app/config/target.json
    volumes:
      - radar-data:/data
      # The image ships the demo target. The deployed identity is host state, so live mode is a
      # file swap plus credentials, never an image rebuild.
      - ${RADAR_TARGET_CONFIG_FILE:-./target.demo.json}:/app/config/target.json:ro
    ports:
      - "${RADAR_BIND_ADDRESS:-127.0.0.1}:${RADAR_PORT:-4173}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  radar-data:
